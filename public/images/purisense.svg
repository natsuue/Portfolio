<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1216"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#47afff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#47afff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2228"/>
      <stop offset="1" stop-color="#121519"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47afff"/>
      <stop offset="1" stop-color="#ffb547"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- purifier unit -->
  <g transform="translate(250 150)">
    <ellipse cx="190" cy="712" rx="200" ry="18" fill="#000" fill-opacity="0.45"/>
    <rect width="380" height="700" rx="56" fill="url(#body)" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="30" y="30" width="320" height="120" rx="26" fill="#0c0e11" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="60" y="80" fill="#85888f" font-size="15" letter-spacing="2">IN / OUT · EFFICIENCY</text>
    <text x="60" y="124" fill="#47afff" font-size="30" letter-spacing="1">GOOD</text>
    <circle cx="316" cy="90" r="10" fill="#47afff"/>
    <circle cx="316" cy="90" r="20" fill="none" stroke="#47afff" stroke-opacity="0.35" stroke-width="2"/>

    <!-- fan grille -->
    <g transform="translate(190 420)">
      <circle r="150" fill="#0c0e11" stroke="url(#ring)" stroke-width="4"/>
      <circle r="124" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
      <circle r="98" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
      <circle r="72" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
      <g fill="#ffffff" fill-opacity="0.16">
        <path d="M0 -18 C 40 -60, 80 -60, 110 -30 C 70 -30, 35 -20, 0 -18Z"/>
        <path d="M0 -18 C 40 -60, 80 -60, 110 -30 C 70 -30, 35 -20, 0 -18Z" transform="rotate(72)"/>
        <path d="M0 -18 C 40 -60, 80 -60, 110 -30 C 70 -30, 35 -20, 0 -18Z" transform="rotate(144)"/>
        <path d="M0 -18 C 40 -60, 80 -60, 110 -30 C 70 -30, 35 -20, 0 -18Z" transform="rotate(216)"/>
        <path d="M0 -18 C 40 -60, 80 -60, 110 -30 C 70 -30, 35 -20, 0 -18Z" transform="rotate(288)"/>
      </g>
      <circle r="24" fill="#1d2228" stroke="#47afff" stroke-width="2"/>
    </g>
    <text x="190" y="650" fill="#85888f" font-size="14" letter-spacing="3" text-anchor="middle">PURISENSE · ESP32</text>
  </g>

  <!-- link: device → cloud → app -->
  <g fill="none" stroke="#47afff" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.7">
    <path d="M650 360 C 760 220, 860 200, 960 250"/>
    <path d="M960 250 C 1040 290, 1060 330, 1080 380"/>
  </g>
  <g font-size="13" letter-spacing="2">
    <rect x="664" y="236" width="148" height="32" rx="16" fill="#0a0b0d" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="738" y="257" fill="#ecebe6" text-anchor="middle">HTTPS · SSE</text>
    <rect x="880" y="200" width="132" height="32" rx="16" fill="#47afff"/>
    <text x="946" y="221" fill="#0a0b0d" text-anchor="middle">FIREBASE</text>
  </g>

  <!-- phone -->
  <g transform="translate(1030 170)">
    <rect width="330" height="660" rx="48" fill="#0c0e11" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <rect x="14" y="14" width="302" height="632" rx="36" fill="#13161a"/>
    <rect x="125" y="28" width="80" height="18" rx="9" fill="#0c0e11"/>
    <text x="40" y="100" fill="#ecebe6" font-size="24" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">PuriSense</text>
    <text x="40" y="126" fill="#85888f" font-size="12" letter-spacing="1.5">LIVING ROOM · ONLINE</text>

    <g transform="translate(165 250)">
      <circle r="92" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="14"/>
      <circle r="92" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" stroke-dasharray="420 578" transform="rotate(-90)"/>
      <text y="-4" fill="#ecebe6" font-size="40" font-weight="600" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">AQ</text>
      <text y="26" fill="#47afff" font-size="13" letter-spacing="2" text-anchor="middle">GOOD</text>
    </g>

    <rect x="34" y="380" width="262" height="100" rx="18" fill="#0c0e11"/>
    <text x="54" y="408" fill="#85888f" font-size="11" letter-spacing="1.5">TODAY</text>
    <path d="M54 460 L90 446 L126 452 L162 430 L198 438 L234 420 L276 424" fill="none" stroke="#ffb547" stroke-width="2.5" stroke-linejoin="round"/>

    <rect x="34" y="498" width="262" height="58" rx="18" fill="#0c0e11"/>
    <text x="54" y="532" fill="#ecebe6" font-size="13" letter-spacing="1.5">AUTO MODE</text>
    <rect x="228" y="514" width="48" height="26" rx="13" fill="#47afff"/>
    <circle cx="263" cy="527" r="10" fill="#0a0b0d"/>

    <rect x="34" y="572" width="262" height="46" rx="18" fill="#0c0e11"/>
    <text x="54" y="600" fill="#85888f" font-size="11" letter-spacing="1.5">FAN</text>
    <rect x="100" y="592" width="176" height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="100" y="592" width="112" height="6" rx="3" fill="#47afff"/>
    <circle cx="212" cy="595" r="9" fill="#ecebe6"/>
  </g>
</svg>
