<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101318"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#47afff"/>
      <stop offset="1" stop-color="#ffb547"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#47afff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#47afff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- window -->
  <g transform="translate(170 140)">
    <rect width="1260" height="720" rx="22" fill="#12151a" stroke="#ffffff" stroke-opacity="0.12"/>
    <path d="M0 22a22 22 0 0 1 22-22h1216a22 22 0 0 1 22 22v34H0z" fill="#171b21"/>
    <circle cx="30" cy="28" r="6" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="52" cy="28" r="6" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="74" cy="28" r="6" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="430" y="15" width="400" height="26" rx="13" fill="#0e1014"/>
    <text x="630" y="33" fill="#85888f" font-size="13" text-anchor="middle">cognitiveai / practitioner</text>

    <!-- sidebar -->
    <rect x="0" y="56" width="230" height="664" fill="#0f1216"/>
    <text x="30" y="104" fill="#ecebe6" font-size="18" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">CognitiveAI</text>
    <rect x="22" y="140" width="186" height="38" rx="9" fill="#47afff" fill-opacity="0.12"/>
    <rect x="38" y="155" width="90" height="8" rx="4" fill="#47afff"/>
    <rect x="38" y="210" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="38" y="250" width="100" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="38" y="290" width="130" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="38" y="330" width="80" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>

    <!-- portal chips -->
    <g font-size="12" letter-spacing="1.5">
      <rect x="22" y="560" width="186" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="115" y="582" fill="#a6a8ae" text-anchor="middle">ADMIN</text>
      <rect x="22" y="604" width="186" height="34" rx="17" fill="#47afff"/>
      <text x="115" y="626" fill="#0a0b0d" text-anchor="middle">PRACTITIONER</text>
      <rect x="22" y="648" width="186" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="115" y="670" fill="#a6a8ae" text-anchor="middle">PATIENT</text>
    </g>

    <!-- model card -->
    <g transform="translate(262 88)">
      <rect width="440" height="250" rx="16" fill="#161a20" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="28" y="44" fill="#85888f" font-size="13" letter-spacing="1.5">MODEL · GRADIENT BOOSTING</text>
      <text x="26" y="150" fill="#ecebe6" font-size="84" font-weight="600" letter-spacing="-4" font-family="ui-sans-serif, system-ui, sans-serif">R² 0.8996</text>
      <rect x="28" y="190" width="384" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="28" y="190" width="345" height="6" rx="3" fill="url(#bar)"/>
    </g>

    <!-- feature importance -->
    <g transform="translate(730 88)">
      <rect width="500" height="560" rx="16" fill="#161a20" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="28" y="44" fill="#85888f" font-size="13" letter-spacing="1.5">FEATURE IMPORTANCE</text>
      <text x="472" y="44" fill="#47afff" font-size="13" text-anchor="end">10 INPUTS</text>
      <g transform="translate(28 80)">
        <rect y="0" width="420" height="22" rx="5" fill="url(#bar)"/>
        <rect y="46" width="352" height="22" rx="5" fill="url(#bar)" fill-opacity="0.9"/>
        <rect y="92" width="300" height="22" rx="5" fill="url(#bar)" fill-opacity="0.8"/>
        <rect y="138" width="246" height="22" rx="5" fill="url(#bar)" fill-opacity="0.7"/>
        <rect y="184" width="204" height="22" rx="5" fill="url(#bar)" fill-opacity="0.6"/>
        <rect y="230" width="170" height="22" rx="5" fill="url(#bar)" fill-opacity="0.5"/>
        <rect y="276" width="132" height="22" rx="5" fill="url(#bar)" fill-opacity="0.42"/>
        <rect y="322" width="104" height="22" rx="5" fill="url(#bar)" fill-opacity="0.34"/>
        <rect y="368" width="74" height="22" rx="5" fill="url(#bar)" fill-opacity="0.26"/>
        <rect y="414" width="48" height="22" rx="5" fill="url(#bar)" fill-opacity="0.2"/>
      </g>
    </g>

    <!-- trend card -->
    <g transform="translate(262 366)">
      <rect width="440" height="282" rx="16" fill="#161a20" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="28" y="44" fill="#85888f" font-size="13" letter-spacing="1.5">COGNITIVE SCORE · REAL TIME</text>
      <path d="M28 230 L88 204 L148 214 L208 170 L268 180 L328 128 L412 104 L412 250 L28 250Z" fill="url(#area)"/>
      <path d="M28 230 L88 204 L148 214 L208 170 L268 180 L328 128 L412 104" fill="none" stroke="#47afff" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="412" cy="104" r="7" fill="#0a0b0d" stroke="#47afff" stroke-width="3"/>
      <path d="M28 250H412" stroke="#ffffff" stroke-opacity="0.1"/>
    </g>
  </g>
</svg>
