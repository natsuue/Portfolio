    <script>
      // Power-up intro: play on every visit, except direct links to a section (e.g. /#contact).
      // The 8 s timeout is a safety net so the site can never stay covered.
      (function () {
        var d = document.documentElement;
        if (location.hash.length > 1) return;
        d.classList.add('is-booting');
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        setTimeout(function () {
          d.classList.remove('is-booting');
          var b = document.getElementById('boot');
          if (b) b.remove();
        }, 8000);
      })();
    </script>
    <style>
      /* First frame of the intro, shown before the app loads (matches the loader's resting NS). */
      #boot { display: none; }
      .is-booting #boot {
        display: block; position: fixed; inset: 0; z-index: 310; background: #0a0b0d;
        background-image: radial-gradient(rgba(236, 235, 230, 0.07) 1px, transparent 1.2px);
        background-size: 24px 24px;
      }
      #boot svg {
        position: absolute; left: 50%; top: 50%; translate: -50% -50%;
        width: clamp(88px, 12vw, 150px); height: clamp(88px, 12vw, 150px);
        overflow: visible; color: rgba(236, 235, 230, 0.36);
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 52 V12 L28 52 V12" />
          <path d="M55 16 L51 12 H40 L36 16 V28 L40 32 H51 L55 36 V48 L51 52 H37" />
        </g>
        <g fill="rgba(212, 255, 63, 0.3)">
          <circle cx="10" cy="52" r="3.6" /><circle cx="28" cy="12" r="3.6" />
          <circle cx="55" cy="16" r="3.6" /><circle cx="37" cy="52" r="3.6" />
        </g>
      </svg>
    </div>
