    <script>
      // Power-up intro (played by the Hero's chip): on every visit, except direct links to a
      // section (e.g. /#contact). The 8 s timeout is a safety net so the site can never stay hidden.
      (function () {
        var d = document.documentElement;
        if (location.hash.length > 1) return;
        d.classList.add('is-booting');
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        setTimeout(function () {
          d.classList.remove('is-booting');
        }, 8000);
      })();
    </script>
